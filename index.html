<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    >

    <!-- Mode aplikasi iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dashboard App">

    <!-- Warna browser/status bar -->
    <meta name="theme-color" content="#0f0f13">

    <title>Dashboard App</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f0f13;
        }

        body {
            /*
             * Menghindari area notch dan indikator Home
             * tanpa membuat halaman keluar dari layar.
             */
            padding-top: env(safe-area-inset-top);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
        }

        .app-container {
            width: 100%;
            height: 100%;

            /* Fallback untuk iPhone lama */
            height: -webkit-fill-available;

            /* Ukuran viewport modern */
            height: 100dvh;
            overflow: hidden;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>
    <main class="app-container">
        <iframe
            src="https://script.google.com/macros/s/AKfycbx5uFwDc0G9PTV2v6Lpd3XKRiSPwIWrmbPUpwkByOl55XqaPccYclsINfQd0Vt0KXEfpw/exec"
            allow="clipboard-read; clipboard-write; fullscreen"
            allowfullscreen>
        </iframe>
    </main>
</body>
</html>
